# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - sakila-app

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: 'ubuntu-latest'

    steps:
    - uses: actions/checkout@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to registry
      uses: docker/login-action@v2
      with:
        registry: https://mcr.microsoft.com/
        username: ${{ secrets.AzureAppService_ContainerUsername_5e77117c417246a39b125ad2e92ad434 }}
        password: ${{ secrets.AzureAppService_ContainerPassword_04d8524d093f4d29a538cb952580fa5c }}

    - name: Build and push container image to registry
      uses: docker/build-push-action@v3
      with:
        push: true
        tags: mcr.microsoft.com/${{ secrets.AzureAppService_ContainerUsername_5e77117c417246a39b125ad2e92ad434 }}/appsvc/staticsite:${{ github.sha }}
        file: ./Dockerfile

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
    - name: Deploy to Azure Web App
      id: deploy-to-webapp
      uses: azure/webapps-deploy@v2
      with:
        app-name: 'sakila-app'
        slot-name: 'production'
        publish-profile: ${{ secrets.AzureAppService_PublishProfile_36ad4867ffac42e08dcbed65d171ca37 }}
        images: 'mcr.microsoft.com/${{ secrets.AzureAppService_ContainerUsername_5e77117c417246a39b125ad2e92ad434 }}/appsvc/staticsite:${{ github.sha }}'